# ============================================================
# Service Account Template
# ============================================================
# [AGENT-EDIT] Replace all <PLACEHOLDER> values with actual
#              deployment-specific values.
# [AGENT-LOCK] Do not remove the platform-managed labels.
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  # [AGENT-EDIT] Service account name and namespace
  name: <SERVICE_ACCOUNT>
  namespace: <NAMESPACE>
  labels:
    # [AGENT-EDIT]
    app.kubernetes.io/name: <APP_NAME>
    app.kubernetes.io/managed-by: adk-platform
    # [AGENT-LOCK] Platform-managed label - do not remove
    platform.example.com/managed: "true"
