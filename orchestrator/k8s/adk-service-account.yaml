apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-sa
  namespace: adk-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-cluster-manager
rules:
  # -------------------------------------------------------------------
  # 1. CORE GROUP (Cluster & Network Foundation)
  # Create, Manage, and Remove: Namespaces, Services, ResourceQuotas
  # -------------------------------------------------------------------
  - apiGroups: [""]
    resources: ["namespaces", "services", "resourcequotas"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]

  # -------------------------------------------------------------------
  # 2. CORE GROUP (Workload Monitoring & Cleanup)
  # Remove and Monitor: Pods
  # -------------------------------------------------------------------
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "get", "list", "watch"]

  # -------------------------------------------------------------------
  # 3. APPS GROUP (Workloads)
  # Create, Manage, and Remove: Deployments
  # Remove and Monitor: ReplicaSets ("everything in between")
  # -------------------------------------------------------------------
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]

  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["delete", "get", "list", "watch"]

  # -------------------------------------------------------------------
  # 4. NETWORKING GROUP (Traffic & Security)
  # Create, Manage, and Remove: Ingress, NetworkPolicies
  # -------------------------------------------------------------------
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]

  # -------------------------------------------------------------------
  # 5. ARGOPROJ GROUP (ArgoCD Custom Resources)
  # Create, Manage, and Remove: ArgoCD Applications
  # -------------------------------------------------------------------
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-cluster-manager-binding
subjects:
  - kind: ServiceAccount
    name: mcp-server-sa
    namespace: adk-platform
roleRef:
  kind: ClusterRole
  name: mcp-cluster-manager
  apiGroup: rbac.authorization.k8s.io
