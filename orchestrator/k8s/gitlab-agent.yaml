# =============================================================================
# GitLab Agent - Deployment + Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-agent
  namespace: adk-platform
  labels:
    app: gitlab-agent
    app.kubernetes.io/part-of: adk-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-agent
  template:
    metadata:
      labels:
        app: gitlab-agent
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: gitlab-agent
          image: harbor.devportal.example.com/apps/adk-gitlab-agent:latest
          ports:
            - containerPort: 8000
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: adk-secrets
                  key: GOOGLE_API_KEY
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: adk-secrets
                  key: GITLAB_TOKEN
            - name: GITLAB_API_URL
              valueFrom:
                secretKeyRef:
                  name: adk-secrets
                  key: GITLAB_API_URL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /list-apps
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /list-apps
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-agent-svc
  namespace: adk-platform
  labels:
    app: gitlab-agent
spec:
  selector:
    app: gitlab-agent
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
