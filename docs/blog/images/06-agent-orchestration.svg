<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="ADK IDP agent orchestration architecture and the eight-step developer onboarding lifecycle">
  <defs>
    <style>
      .ti{font-size:21px;font-weight:700}
      .tm{font-size:18px;font-weight:700}
      .t{font-size:15px}
      .sm{font-size:13px}
      .lg{font-size:40px;font-weight:800}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
      .it{font-style:italic}
    </style>
    <marker id="aBlue" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2DD4BF"/></marker>
    <marker id="aAmber" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D9A441"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4ADE80"/></marker>
    <marker id="aPurple" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A78BFA"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1150" fill="#0B0F17"/>

  <!-- Title -->
  <rect x="40" y="52" width="6" height="140" rx="3" fill="#3B82F6"/>
  <text x="64" y="92" class="lg" fill="#FFFFFF">ADK IDP</text>
  <text x="64" y="138" class="lg" fill="#FFFFFF">Agent Orchestration</text>
  <text x="64" y="182" class="lg" fill="#FFFFFF">Architecture</text>

  <!-- ===== Auth Layer ===== -->
  <rect x="470" y="55" width="680" height="138" rx="14" fill="#241A38" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="490" y="72" width="14" height="11" rx="2" fill="none" stroke="#C4B5FD" stroke-width="2"/>
  <path d="M492.5,72 a4.5,4.5 0 0 1 9,0" fill="none" stroke="#C4B5FD" stroke-width="2"/>
  <text x="512" y="83" class="ti" fill="#C4B5FD">Auth Layer</text>
  <rect x="752" y="74" width="384" height="104" rx="10" fill="#2E2150" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="770" y="90" width="12" height="10" rx="2" fill="none" stroke="#EDE9FE" stroke-width="1.6"/>
  <path d="M772,90 a4,4 0 0 1 8,0" fill="none" stroke="#EDE9FE" stroke-width="1.6"/>
  <text x="792" y="100" class="ti" fill="#EDE9FE">Orchestrator UI</text>
  <text x="770" y="126" class="t" fill="#C4B5FD">GitLab OIDC SSO gateway</text>
  <rect x="770" y="138" width="346" height="28" rx="6" fill="#1B1430" stroke="#4C3A79"/>
  <text x="784" y="157" class="mono" fill="#C4B5FD">your-org/idp-platform</text>

  <!-- ===== Agent Layer ===== -->
  <rect x="470" y="222" width="680" height="476" rx="14" fill="#0E2142" stroke="#3B82F6" stroke-width="2"/>
  <text x="1132" y="686" class="ti" fill="#60A5FA" text-anchor="end">Agent Layer</text>

  <!-- Orchestrator Agent -->
  <rect x="665" y="250" width="290" height="92" rx="10" fill="#15325C" stroke="#3B82F6" stroke-width="1.5"/>
  <g stroke="#93C5FD" stroke-width="1.8" fill="none"><rect x="696" y="280" width="22" height="18" rx="5"/><line x1="707" y1="280" x2="707" y2="273"/></g>
  <circle cx="707" cy="272" r="2.4" fill="#93C5FD"/><circle cx="702" cy="289" r="2" fill="#93C5FD"/><circle cx="712" cy="289" r="2" fill="#93C5FD"/>
  <text x="732" y="287" class="tm" fill="#DBEAFE">Orchestrator Agent</text>
  <text x="732" y="312" class="sm" fill="#93C5FD">(devportal/adk)</text>

  <!-- GitLab Agent -->
  <rect x="485" y="408" width="270" height="282" rx="10" fill="#13294D" stroke="#3B82F6" stroke-width="1.5"/>
  <g stroke="#93C5FD" stroke-width="1.8" fill="none"><rect x="502" y="434" width="22" height="18" rx="5"/><line x1="513" y1="434" x2="513" y2="427"/></g>
  <circle cx="513" cy="426" r="2.4" fill="#93C5FD"/><circle cx="508" cy="443" r="2" fill="#93C5FD"/><circle cx="518" cy="443" r="2" fill="#93C5FD"/>
  <text x="536" y="449" class="tm" fill="#DBEAFE">GitLab Agent</text>
  <text x="504" y="492" class="t" fill="#BFDBFE">&#8226; Analyze repos</text>
  <text x="504" y="522" class="t" fill="#BFDBFE">&#8226; Clone templates</text>
  <text x="504" y="552" class="t" fill="#BFDBFE">&#8226; Create branches</text>
  <text x="504" y="582" class="t" fill="#BFDBFE">&#8226; Commit files</text>
  <text x="504" y="612" class="t" fill="#BFDBFE">&#8226; Open Merge Requests</text>

  <!-- Kubernetes Agent -->
  <rect x="865" y="408" width="275" height="282" rx="10" fill="#13294D" stroke="#3B82F6" stroke-width="1.5"/>
  <g stroke="#93C5FD" stroke-width="1.8" fill="none"><rect x="882" y="434" width="22" height="18" rx="5"/><line x1="893" y1="434" x2="893" y2="427"/></g>
  <circle cx="893" cy="426" r="2.4" fill="#93C5FD"/><circle cx="888" cy="443" r="2" fill="#93C5FD"/><circle cx="898" cy="443" r="2" fill="#93C5FD"/>
  <text x="916" y="449" class="tm" fill="#DBEAFE">Kubernetes Agent</text>
  <text x="884" y="492" class="t" fill="#BFDBFE">&#8226; Apply Namespace manifests</text>
  <text x="884" y="522" class="t" fill="#BFDBFE">&#8226; Interpolate + apply ArgoCD</text>
  <text x="898" y="544" class="t" fill="#BFDBFE">Application templates</text>
  <text x="884" y="574" class="t" fill="#BFDBFE">&#8226; Poll sync status</text>
  <text x="884" y="604" class="t" fill="#BFDBFE">&#8226; Generate scoped kubeconfigs</text>

  <!-- ===== MCP Server Layer ===== -->
  <rect x="470" y="738" width="680" height="140" rx="14" fill="#0C2E2E" stroke="#2DD4BF" stroke-width="2"/>
  <text x="1132" y="866" class="ti" fill="#5EEAD4" text-anchor="end">MCP Server Layer</text>
  <rect x="485" y="760" width="270" height="96" rx="10" fill="#0F3A3A" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="504" y="793" class="mono" fill="#CCFBF1" font-weight="700" font-size="17">gitlab-mcp-server</text>
  <text x="504" y="818" class="sm" fill="#5EEAD4">Exposes GitLab API tools</text>
  <text x="504" y="837" class="sm" fill="#5EEAD4">over HTTP SSE</text>
  <rect x="865" y="760" width="275" height="96" rx="10" fill="#0F3A3A" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="884" y="793" class="mono" fill="#CCFBF1" font-weight="700" font-size="17">kubernetes-mcp-server</text>
  <text x="884" y="818" class="sm" fill="#5EEAD4">Exposes RBAC-scoped cluster</text>
  <text x="884" y="837" class="sm" fill="#5EEAD4">operations over HTTP SSE</text>

  <!-- ===== Developer ===== -->
  <rect x="48" y="300" width="270" height="110" rx="12" fill="#332611" stroke="#D9A441" stroke-width="2"/>
  <circle cx="183" cy="338" r="11" fill="none" stroke="#F2C879" stroke-width="2"/>
  <path d="M166,368 a17,15 0 0 1 34,0" fill="none" stroke="#F2C879" stroke-width="2"/>
  <text x="183" y="398" class="ti" fill="#F2C879" text-anchor="middle">Developer</text>
  <text x="56" y="452" class="t" fill="#E8D9B5">&#8226; Submit GitLab repo URL</text>
  <text x="56" y="480" class="t" fill="#E8D9B5">&#8226; Review generated Merge Request</text>
  <text x="56" y="508" class="t" fill="#E8D9B5">&#8226; Merge it</text>
  <text x="56" y="536" class="t" fill="#E8D9B5">&#8226; Receives scoped kubeconfig</text>

  <!-- ===== GitLab.com ===== -->
  <rect x="48" y="742" width="300" height="168" rx="12" fill="#332611" stroke="#D9A441" stroke-width="2"/>
  <text x="70" y="780" class="ti" fill="#F2C879">GitLab.com</text>
  <text x="68" y="818" class="sm" fill="#E8D9B5">&#8226; Hosts developer repos and</text>
  <text x="82" y="837" class="sm" fill="#E8D9B5">CI/CD pipelines</text>
  <text x="68" y="868" class="sm" fill="#E8D9B5">&#8226; Kaniko image build process</text>

  <!-- ===== GitOps / Registry ===== -->
  <rect x="485" y="945" width="290" height="92" rx="12" fill="#163A1E" stroke="#4ADE80" stroke-width="2"/>
  <rect x="512" y="972" width="22" height="22" rx="3" fill="none" stroke="#BBF7D0" stroke-width="2"/><path d="M512,978 l11,6 l11,-6 M523,984 l0,10" stroke="#BBF7D0" stroke-width="1.6" fill="none"/>
  <text x="552" y="999" class="ti" fill="#BBF7D0">Harbor Registry</text>
  <rect x="865" y="945" width="275" height="92" rx="12" fill="#163A1E" stroke="#4ADE80" stroke-width="2"/>
  <circle cx="915" cy="983" r="12" fill="none" stroke="#BBF7D0" stroke-width="2"/><path d="M915,975 l0,16 M907,983 l16,0" stroke="#BBF7D0" stroke-width="1.6"/>
  <text x="942" y="991" class="ti" fill="#BBF7D0">ArgoCD</text>

  <!-- ===== Connections ===== -->
  <!-- Developer -> Orchestrator Agent -->
  <line x1="320" y1="348" x2="660" y2="300" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="420" y="316" class="sm it" fill="#93C5FD">OIDC SSO / HTTPS</text>
  <!-- Orchestrator Agent -> Orchestrator UI -->
  <line x1="810" y1="250" x2="900" y2="180" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#aPurple)"/>
  <text x="820" y="222" class="sm it" fill="#C4B5FD">Authenticates users</text>
  <!-- Orchestrator -> GitLab Agent -->
  <line x1="760" y1="342" x2="625" y2="406" stroke="#3B82F6" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="648" y="372" class="sm it" fill="#93C5FD">A2A HTTP</text>
  <text x="640" y="390" class="sm it" fill="#93C5FD">(delegate task)</text>
  <!-- Orchestrator -> Kubernetes Agent -->
  <line x1="862" y1="342" x2="998" y2="406" stroke="#3B82F6" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="905" y="372" class="sm it" fill="#93C5FD">A2A HTTP</text>
  <text x="897" y="390" class="sm it" fill="#93C5FD">(delegate task)</text>
  <!-- GitLab Agent -> gitlab-mcp (SSE) -->
  <line x1="620" y1="690" x2="620" y2="758" stroke="#2DD4BF" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#aTeal)"/>
  <text x="634" y="712" class="sm it" fill="#5EEAD4">HTTP SSE</text>
  <text x="634" y="730" class="sm it" fill="#5EEAD4">(MCP tool calls)</text>
  <!-- Kubernetes Agent -> kubernetes-mcp (SSE) -->
  <line x1="1000" y1="690" x2="1000" y2="758" stroke="#2DD4BF" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#aTeal)"/>
  <text x="1014" y="712" class="sm it" fill="#5EEAD4">HTTP SSE</text>
  <text x="1014" y="730" class="sm it" fill="#5EEAD4">(MCP tool calls)</text>
  <!-- gitlab-mcp -> GitLab.com (external API) -->
  <line x1="483" y1="806" x2="352" y2="806" stroke="#D9A441" stroke-width="2.2" stroke-dasharray="2 6" marker-end="url(#aAmber)"/>
  <text x="360" y="796" class="sm it" fill="#F2C879">GitLab REST API</text>
  <!-- GitLab.com -> Harbor (Kaniko push) -->
  <path d="M198,910 L198,992 L481,992" fill="none" stroke="#D9A441" stroke-width="2.2" stroke-dasharray="2 6" marker-end="url(#aAmber)"/>
  <text x="70" y="950" class="sm it" fill="#F2C879">Kaniko push</text>
  <text x="70" y="968" class="sm it" fill="#F2C879">(container image)</text>
  <!-- kubernetes-mcp -> ArgoCD (K8s API) -->
  <line x1="1000" y1="858" x2="1000" y2="943" stroke="#4ADE80" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#aGreen)"/>
  <text x="1014" y="892" class="sm it" fill="#86EFAC">K8s API</text>
  <text x="1014" y="910" class="sm it" fill="#86EFAC">(apply ArgoCD App)</text>
  <!-- ArgoCD -> Harbor (image pull) -->
  <line x1="863" y1="991" x2="779" y2="991" stroke="#4ADE80" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#aGreen)"/>
  <!-- Returns scoped kubeconfig -->
  <path d="M468,600 L400,600 L400,556 L384,556" fill="none" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <text x="150" y="600" class="sm it" fill="#93C5FD">Returns scoped kubeconfig</text>

  <!-- ===== Lifecycle ===== -->
  <text x="1190" y="78" class="ti" fill="#FFFFFF">Developer onboarding lifecycle</text>
  <g font-weight="700" font-size="15">
    <circle cx="1208" cy="120" r="16" fill="#D9A441"/><text x="1208" y="125" fill="#1B1206" text-anchor="middle">1</text>
    <circle cx="1208" cy="208" r="16" fill="#D9A441"/><text x="1208" y="213" fill="#1B1206" text-anchor="middle">2</text>
    <circle cx="1208" cy="296" r="16" fill="#D9A441"/><text x="1208" y="301" fill="#1B1206" text-anchor="middle">3</text>
    <circle cx="1208" cy="384" r="16" fill="#D9A441"/><text x="1208" y="389" fill="#1B1206" text-anchor="middle">4</text>
    <circle cx="1208" cy="490" r="16" fill="#D9A441"/><text x="1208" y="495" fill="#1B1206" text-anchor="middle">5</text>
    <circle cx="1208" cy="566" r="16" fill="#D9A441"/><text x="1208" y="571" fill="#1B1206" text-anchor="middle">6</text>
    <circle cx="1208" cy="654" r="16" fill="#D9A441"/><text x="1208" y="659" fill="#1B1206" text-anchor="middle">7</text>
    <circle cx="1208" cy="742" r="16" fill="#D9A441"/><text x="1208" y="747" fill="#1B1206" text-anchor="middle">8</text>
  </g>
  <g stroke="#3A3326" stroke-width="2"><line x1="1208" y1="136" x2="1208" y2="192"/><line x1="1208" y1="224" x2="1208" y2="280"/><line x1="1208" y1="312" x2="1208" y2="368"/><line x1="1208" y1="400" x2="1208" y2="474"/><line x1="1208" y1="506" x2="1208" y2="550"/><line x1="1208" y1="582" x2="1208" y2="638"/><line x1="1208" y1="670" x2="1208" y2="726"/></g>
  <text x="1240" y="125" class="t" fill="#E5E7EB">Developer submits repo URL</text>
  <text x="1240" y="213" class="t" fill="#E5E7EB">GitLab Agent inspects tech stack</text>
  <text x="1240" y="301" class="t" fill="#E5E7EB">Orchestrator gathers metadata</text>
  <text x="1240" y="372" class="t" fill="#E5E7EB">GitLab Agent creates branch, commits</text>
  <text x="1240" y="391" class="t" fill="#E5E7EB">Dockerfile + manifests + CI config,</text>
  <text x="1240" y="410" class="t" fill="#E5E7EB">opens MR</text>
  <text x="1240" y="495" class="t" fill="#E5E7EB">Developer reviews and merges MR</text>
  <text x="1240" y="559" class="t" fill="#E5E7EB">GitLab CI builds image via Kaniko,</text>
  <text x="1240" y="578" class="t" fill="#E5E7EB">pushes to Harbor</text>
  <text x="1240" y="647" class="t" fill="#E5E7EB">Kubernetes Agent applies Namespace</text>
  <text x="1240" y="666" class="t" fill="#E5E7EB">+ ArgoCD Application</text>
  <text x="1240" y="735" class="t" fill="#E5E7EB">ArgoCD syncs; developer receives</text>
  <text x="1240" y="754" class="t" fill="#E5E7EB">scoped kubeconfig</text>

  <!-- ===== Legend ===== -->
  <rect x="1296" y="835" width="286" height="300" rx="12" fill="#11151F" stroke="#2A2F3A" stroke-width="1.5"/>
  <text x="1314" y="866" class="t" font-weight="700" fill="#FFFFFF">Connection types</text>
  <line x1="1314" y1="888" x2="1356" y2="888" stroke="#C7CCD6" stroke-width="2.5"/><text x="1368" y="893" class="sm" fill="#C7CCD6">A2A HTTP</text>
  <line x1="1314" y1="914" x2="1356" y2="914" stroke="#C7CCD6" stroke-width="2.5" stroke-dasharray="8 5"/><text x="1368" y="919" class="sm" fill="#C7CCD6">HTTP SSE (MCP)</text>
  <line x1="1314" y1="940" x2="1356" y2="940" stroke="#C7CCD6" stroke-width="2.5" stroke-dasharray="2 5"/><text x="1368" y="945" class="sm" fill="#C7CCD6">External API</text>
  <text x="1314" y="982" class="t" font-weight="700" fill="#FFFFFF">Layer colors</text>
  <rect x="1314" y="996" width="16" height="16" rx="3" fill="#3B82F6"/><text x="1340" y="1009" class="sm" fill="#C7CCD6">Agents</text>
  <rect x="1314" y="1022" width="16" height="16" rx="3" fill="#2DD4BF"/><text x="1340" y="1035" class="sm" fill="#C7CCD6">MCP Servers</text>
  <rect x="1314" y="1048" width="16" height="16" rx="3" fill="#D9A441"/><text x="1340" y="1061" class="sm" fill="#C7CCD6">External Systems</text>
  <rect x="1314" y="1074" width="16" height="16" rx="3" fill="#8B5CF6"/><text x="1340" y="1087" class="sm" fill="#C7CCD6">Auth</text>
  <rect x="1314" y="1100" width="16" height="16" rx="3" fill="#4ADE80"/><text x="1340" y="1113" class="sm" fill="#C7CCD6">GitOps / Registry</text>
</svg>
